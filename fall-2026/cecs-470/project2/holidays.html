<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="holidays.css" />
    <title>Home Page - Holiday Viewer</title>
  </head>
  <body>
    <h1>Public Holidays Finder</h1>
    <div id="inputs">
      <div>
        <label>Country Code:</label>
        <input type="text" id="country-code-input" />
      </div>
      <div>
        <label>Year:</label>
        <input type="text" id="year-input" />
      </div>
      <div>
        <button id="submit-btn">Submit</button>
      </div>
    </div>
    <table id="holiday-table">
      <thead>
        <tr>
          <th>Date</th>
          <th>Local Name</th>
          <th>Name</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
    <script src="holidays.js"></script>
  </body>
</html>
